name: 020-manual-input-workflow

on:
  push:
    branches:
      - main
      - section2/githubactions/inputs
      - dev
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        default: 'World'
        required: true

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: send greeeting
        run: echo 'Hello ${{ github.event.inputs.name }}'